services:
  - type: web
    name: eval-rails
    env: ruby
    plan: free
    region: oregon
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: GEMINI_API_KEY
        sync: false
